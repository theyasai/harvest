}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {

    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171b; --sky: #1a2228; --panel: rgba(24, 31, 37, 0.86); --fg: #e6edf2;

html, body { height: 100%; }
body {

#view { position: absolute; inset: 0; touch-action: none; }

.top, .bar {

.top { top: 0; padding-block: 14px 0; }
.bar { bottom: 0; padding-block: 0 max(14px, env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; }
.card {

}
.head { display: inline-flex; flex-direction: column; gap: 2px; padding: 10px 14px; max-width: 100%; }
.head h1 { margin: 0; font-family: var(--font-display); font-size: 17px; font-weight: 700; letter-spacing: 0.02em; text-wrap: balance; }
.head p { margin: 0; color: var(--muted); font-size: 12px; }
.head .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; justify-content: center; max-width: 100%; }
.seg { display: flex; gap: 2px; background: var(--line); border-radius: 9px; padding: 2px; }
button {
  font: inherit; font-size: 14px; color: var(--fg); background: transparent; border: 0;
  padding: 8px 12px; border-radius: 7px; cursor: pointer; min-height: 36px;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 700; }
.toggle { border: 1px solid var(--line); }
.toggle[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint { margin-top: 6px; font-size: 11px; color: var(--muted); }
.fixes {
  position: absolute; z-index: 3; right: max(16px, env(safe-area-inset-right, 0px)); top: 14px;
  width: min(360px, calc(100% - 32px)); max-height: calc(100% - 110px - env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; overflow: hidden;
}
.fixes[hidden] { display: none; }
.fixes header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 8px 6px 14px; }
.fixes h2 { margin: 0; font-size: 15px; font-weight: 700; }
.fixes .scroll { overflow-y: auto; padding: 0 8px 10px; display: flex; flex-direction: column; gap: 4px; }
.fix { display: grid; grid-template-columns: 26px 1fr; gap: 10px; text-align: left; padding: 10px 8px; border-radius: 9px; min-width: 0; }
.fix:hover, .fix.active { background: var(--line); }
.fix .no {
  width: 24px; height: 24px; border-radius: 50%; background: var(--pin); color: #fff;
  font: 700 13px/24px var(--font-num); text-align: center;
}
.fix b { display: block; font-size: 14px; margin-bottom: 4px; }
.fix .fl { font: 500 11px var(--font-num); color: var(--muted); margin-left: 6px; }
.fix p { margin: 0 0 3px; font-size: 12.5px; line-height: 1.6; color: var(--muted); }
.fix p span { display: inline-block; font-size: 11px; font-weight: 700; padding: 0 5px; margin-right: 5px; border-radius: 4px; }
.fix p .b { color: var(--warn); border: 1px solid var(--warn); }
.fix p .a { color: var(--good); border: 1px solid var(--good); }
.notes { margin: 6px 8px 0; padding: 10px 8px 4px; border-top: 1px solid var(--line); }
.notes h3 { margin: 0 0 6px; font-size: 13px; }
.notes ul { margin: 0; padding-left: 18px; font-size: 12.5px; line-height: 1.6; color: var(--muted); }
.close { min-height: 32px; padding: 4px 10px; font-size: 13px; color: var(--muted); }
@media (max-width: 720px) {
  .fixes { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: auto;

}

function makeLabel(text) {

  ctx.font = `700 ${fs}px "Zen Kaku Gothic New", "Hiragino Sans", sans-serif`;

  ctx.font = `700 ${fs}px "Zen Kaku Gothic New", "Hiragino Sans", sans-serif`;
  ctx.fillStyle = 'rgba(31,42,51,0.82)';
  const r = h / 2;
  ctx.beginPath();
  ctx.moveTo(r, 0); ctx.arcTo(w, 0, w, h, r); ctx.arcTo(w, h, 0, h, r); ctx.arcTo(0, h, 0, 0, r); ctx.arcTo(0, 0, w, 0, r);

  ctx.fillStyle = '#ffffff';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, pad, h / 2 + dpr);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  const k = 0.0085;
  sp.scale.set(w * k / dpr, h * k / dpr, 1);

}

}
const pinSprites = [];
function makePin(n) {
  const sz = 96, c = document.createElement('canvas');
  c.width = c.height = sz;
  const ctx = c.getContext('2d');
  const pin = getComputedStyle(document.documentElement).getPropertyValue('--pin').trim() || '#d2552d';
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(sz / 2, sz / 2, sz / 2 - 2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = pin;
  ctx.beginPath(); ctx.arc(sz / 2, sz / 2, sz / 2 - 9, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.font = '700 46px "IBM Plex Mono", ui-monospace, monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(String(n), sz / 2, sz / 2 + 2);
  const tex = new THREE.CanvasTexture(c);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  sp.scale.set(0.8, 0.8, 1);
  sp.renderOrder = 11;
  return sp;
}
function buildPins() {
  for (const sp of pinSprites) sp.parent.remove(sp);
  pinSprites.length = 0;
  SCENE.fixes.forEach((f, i) => {
    const sp = makePin(i + 1);
    sp.position.set(...f.p);
    group(f.g).add(sp);
    pinSprites.push(sp);
  });
}
function buildSprites() { buildLabels(); buildPins(); updateLabels(); }
buildLabels();
buildPins();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(buildSprites);

const [W, D] = SCENE.size;
document.getElementById('dims').textContent = `${W.toFixed(2)} × ${D.toFixed(2)} m`;
const META = Object.assign({
  before: '図面', after: '修正', button: '修正点',
}, SCENE.meta || {});
for (const k of ['title', 'subtitle', 'hint']) if (META[k]) document.getElementById(k).textContent = META[k];
if (META.title) document.title = META.title;
if (META.panelTitle) document.getElementById('panel-title').textContent = META.panelTitle;
// 平屋なら「分解」「2F」は使わない
const FLOORS = SCENE.groups.filter((g) => g !== 'roof');
const SINGLE = FLOORS.length === 1;
// 家と敷地の大きさに合わせてカメラと影の範囲を広げる
const SCALE = Math.max(1, Math.max(W, D) / 12.5);
Object.assign(sun.shadow.camera, { left: -12 * SCALE, right: 12 * SCALE, top: 12 * SCALE, bottom: -12 * SCALE, far: 50 * SCALE });
sun.position.multiplyScalar(SCALE);
sun.shadow.camera.updateProjectionMatrix();
controls.maxDistance = 60 * SCALE;

function applyBg() {
  const sky = getComputedStyle(document.documentElement).getPropertyValue('--sky').trim() || '#dfe6ec';
  scene.background = new THREE.Color(sky);
}
applyBg();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyBg);
new MutationObserver(applyBg).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// 表示モード
const LIFT = 4.2;
const MODES = {
  explode: { show: ['1F', '2F'], lift: LIFT, cam: [17, 19, 21], target: [0, 2.6, 0] },
  outside: { show: ['1F', '2F', 'roof'], lift: 0, cam: [15, 10, 18], target: [0, 2.2, 0] },
  '1f': { show: ['1F'], lift: 0, cam: [9, 15, 14], target: [0, 0.5, 0] },
  '2f': { show: ['1F', '2F'], lift: 0, cam: [9, 18, 14], target: [0, 3.2, 0] },
};
if (SINGLE) {
  delete MODES.explode;
  delete MODES['2f'];
  document.getElementById('v-explode').hidden = true;
  document.getElementById('v-2f').hidden = true;
  document.getElementById('v-1f').textContent = '間取り';
}
// 平屋は敷地ごと見せるので少し引く
for (const m of Object.values(MODES)) m.cam = m.cam.map((v) => v * SCALE * (SINGLE ? 1.2 : 1));
const START = SINGLE ? '1f' : 'explode';
let lift = 0, liftTo = 0, labelsOn = true, mode = 'explode';
let camTo = null;
// 縦長の画面では家全体が収まるようにカメラを引く
function camPos(m) {
  const t = new THREE.Vector3(...m.target);
  const aspect = host.clientWidth / Math.max(1, host.clientHeight);
  const k = aspect < 1 ? Math.min(1.9, 1 / aspect * 0.85) : 1;
  return new THREE.Vector3(...m.cam).sub(t).multiplyScalar(k).add(t);
}
function setMode(name, moveCam = true) {
  mode = name;
  const m = MODES[name];
  for (const [g, obj] of Object.entries(groups)) obj.visible = g === 'site' || m.show.includes(g);
  liftTo = m.lift;
  for (const k of Object.keys(MODES)) document.getElementById('v-' + k).setAttribute('aria-pressed', k === name);
  updateLabels();
  if (moveCam) camTo = { pos: camPos(m), target: new THREE.Vector3(...m.target), t: 0 };
}
function updateLabels() {
  for (const l of labelSprites) {
    l.visible = labelsOn && mode !== 'outside' && !(mode === '2f' && l.parent === groups['1F']);
  }
  for (const p of pinSprites) p.visible = mode !== 'outside' && !(mode === '2f' && p.parent === groups['1F']);
}
for (const k of Object.keys(MODES)) document.getElementById('v-' + k).addEventListener('click', () => setMode(k));
document.getElementById('t-label').addEventListener('click', (e) => {
  labelsOn = !labelsOn;
  e.currentTarget.setAttribute('aria-pressed', labelsOn);
  updateLabels();
});
controls.addEventListener('start', () => { camTo = null; });

// 修正点の一覧
const panel = document.getElementById('fixes');
const fixBtn = document.getElementById('t-fix');
function showPanel(on) {
  panel.hidden = !on;
  fixBtn.setAttribute('aria-pressed', on);
  resize();
}
fixBtn.addEventListener('click', () => showPanel(panel.hidden));
document.getElementById('fix-close').addEventListener('click', () => showPanel(false));
document.getElementById('fix-count').textContent = `${SCENE.fixes.length}件`;
fixBtn.textContent = `${META.button} ${SCENE.fixes.length}`;
// スマホでは最初は閉じて、家全体を見せる
if (host.clientWidth <= 720) showPanel(false);
const esc = (t) => t.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const list = document.getElementById('fix-list');
SCENE.fixes.forEach((f, i) => {
  const b = document.createElement('button');
  b.className = 'fix';
  const fl = SINGLE ? '' : `<span class="fl">${f.g}</span>`;
  b.innerHTML = `<span class="no">${i + 1}</span><span><b>${esc(f.title)}${fl}</b>`
    + `<p><span class="b">${esc(META.before)}</span>${esc(f.before)}</p>`
    + `<p><span class="a">${esc(META.after)}</span>${esc(f.after)}</p></span>`;
  b.addEventListener('click', () => {
    for (const el of list.children) el.classList.toggle('active', el === b);
    setMode(f.g === '1F' ? '1f' : '2f', false);
    const t = new THREE.Vector3(...f.p);
    t.y -= 1.4;
    camTo = { pos: t.clone().add(new THREE.Vector3(3.2, 6.5, 6.2)), target: t, t: 0 };
  });
  list.appendChild(b);
});
document.getElementById('note-list').innerHTML = SCENE.notes.map((n) => `<li>${esc(n)}</li>`).join('');

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
camera.position.copy(camPos(MODES[START]));
controls.target.set(...MODES[START].target);
setMode(START, false);
lift = MODES[START].lift;

// 一覧パネルが開いているときは、残りの領域の中央に家が来るよう視野をずらす
function resize() {
  const w = host.clientWidth, h = host.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  let dx = 0, dy = 0;
  if (!panel.hidden) {
    const r = panel.getBoundingClientRect();
    if (w > 720) dx = (r.width + 16) / 2;
    else dy = (h - r.top) / 2 - 30;
  }
  camera.setViewOffset(w, h, dx, dy, w, h);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

function tick() {
  lift += reduce ? liftTo - lift : (liftTo - lift) * 0.12;
  if (groups['2F']) groups['2F'].position.y = lift;
  if (groups.roof) groups.roof.position.y = lift;
  if (camTo) {
    camTo.t = reduce ? 1 : Math.min(1, camTo.t + 0.05);
    camera.position.lerp(camTo.pos, camTo.t);
    controls.target.lerp(camTo.target, camTo.t);
    if (camTo.t >= 1) camTo = null;
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>
