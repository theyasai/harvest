<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>収穫記録</title>
<style>
  :root {
    --bg: #f4f6f2;
    --card: #ffffff;
    --text: #1d1f1b;
    --sub: #5b6157;
    --ok: #1f8a3b;
    --warn: #c77700;
    --ng: #c62828;
    --info: #2a78d6;
    --line: #dde2d8;
    --lookup: #6250d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141613;
      --card: #1f221d;
      --text: #f0f2ec;
      --sub: #b3b9ac;
      --line: #33382f;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    min-height: 100vh;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 15px; color: var(--sub); margin-bottom: 12px;
  }
  .badge {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 12px; font-weight: 600;
  }
  .badge.scanning { background: var(--ok); border-color: var(--ok); color: #fff; }
  .card {
    background: var(--card); border-radius: 20px; padding: 28px 20px;
    text-align: center; border: 4px solid var(--line);
  }
  .card.ok   { border-color: var(--ok); }
  .card.warn { border-color: var(--warn); }
  .card.ng   { border-color: var(--ng); }
  .card.info { border-color: var(--info); }
  .icon { font-size: 64px; line-height: 1; margin-bottom: 12px; }
  h1 { font-size: 26px; margin: 0 0 12px; }
  .big { font-size: 40px; font-weight: 800; margin: 8px 0; word-break: break-all; }
  .msg { font-size: 18px; color: var(--sub); line-height: 1.6; margin: 0; white-space: pre-line; }
  .say {
    margin-top: 16px; padding: 10px 0; font-size: 16px;
  }
  .status {
    margin-top: 16px; background: var(--card); border-radius: 16px;
    padding: 16px; border: 1px solid var(--line); font-size: 16px; line-height: 1.9;
  }
  .status b { font-size: 18px; }
  .pending {
    margin-top: 16px; padding: 12px 16px; border-radius: 12px;
    background: var(--warn); color: #fff; font-weight: 700; text-align: center;
  }
  .section-title { font-size: 14px; color: var(--sub); margin: 24px 0 8px; }
  .devices { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  button, .btn {
    appearance: none; -webkit-appearance: none;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 12px; padding: 14px 0; font-size: 18px; font-weight: 700;
    width: 100%; text-align: center; text-decoration: none; display: block;
    font-family: inherit;
  }
  button.active { background: var(--info); color: #fff; border-color: var(--info); }
  .scan-btn {
    margin-top: 16px; padding: 22px 0; font-size: 24px;
    background: var(--ok); color: #fff; border-color: var(--ok);
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .spinner {
    width: 56px; height: 56px; margin: 0 auto 16px;
    border: 6px solid var(--line); border-top-color: var(--info);
    border-radius: 50%; animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .lookup-banner {
    margin-bottom: 12px; padding: 12px 16px; border-radius: 12px;
    background: var(--lookup); color: #fff; font-weight: 800; font-size: 18px; text-align: center;
  }
  .card.lookup { border-color: var(--lookup); }
  button.lookup-on { background: var(--lookup); color: #fff; border-color: var(--lookup); }
  .history { margin: 16px 0 0; padding: 0; list-style: none; font-size: 16px; color: var(--sub); line-height: 1.8; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <span id="modeLabel">収穫記録</span>
    <span class="badge" id="deviceBadge">端末 --</span>
  </div>

  <!-- 検索モード中の表示 -->
  <div class="lookup-banner" id="lookupBanner" hidden>🔍 検索モード（記録されません）</div>

  <!-- メイン表示（状況に応じて中身が変わる） -->
  <div class="card" id="card">
    <div id="spinner" class="spinner" hidden></div>
    <div class="icon" id="icon"></div>
    <h1 id="title"></h1>
    <div class="big" id="big"></div>
    <p class="msg" id="msg"></p>
    <ul class="history" id="history" hidden></ul>
    <button type="button" class="say" id="sayBtn" hidden>🔊 読み上げ</button>
  </div>

  <!-- Android 用：読み取り開始ボタン -->
  <button type="button" class="scan-btn" id="scanBtn" hidden>▶ 読み取り開始</button>

  <!-- 電波が悪くて送れなかった記録 -->
  <div class="pending" id="pending" hidden></div>

  <!-- 現在の設定 -->
  <div class="status" id="status">
    作業者：<b id="nowWorker">未設定</b><br>
    端末番号：<b id="nowDevice">未設定</b><br>
    合言葉：<b id="nowKey">未設定</b>
  </div>

  <!-- 設定（ホーム画面のときだけ表示） -->
  <div id="settings" hidden>
    <div class="section-title">この端末の番号（最初に1回だけ設定）</div>
    <div class="devices" id="deviceButtons"></div>

    <div class="section-title">その他</div>
    <div class="row">
      <button type="button" id="voiceBtn">音声：ON</button>
      <button type="button" id="clearWorker">作業者を解除</button>
    </div>
    <div class="row">
      <button type="button" id="lookupBtn">🔍 検索モード：OFF</button>
      <a class="btn" href="dashboard.html">ダッシュボード</a>
    </div>
  </div>

</div>

<script>
// ====== 設定 ======================================================
// GAS（Google Apps Script）のウェブアプリURL
const GAS_URL = 'https://script.google.com/macros/s/AKfycbx3n7p5f1efbJdAP9n-h1xkLPK2cTUjf36nQZNvX2suCPaiv8Ae1-qRJPLJA6mahX7L/exec';
// 作業者カードをタッチしてから何時間で作業者設定を無効にするか（翌日の付け忘れ防止）
const WORKER_EXPIRE_HOURS = 12;
// 端末の台数
const DEVICE_COUNT = 5;
// コンテナ番号の範囲
const CONTAINER_MIN = 1;
const CONTAINER_MAX = 1000;
// 送れなかった記録を再送する間隔（秒）
const RETRY_SECONDS = 15;
// ================================================================

// ページが開いた瞬間＝NFCをタッチした瞬間 の時刻を最初に記録しておく（iPhone 用）
const touchTime = new Date();

// Android の Chrome なら Web NFC が使える
const HAS_WEB_NFC = 'NDEFReader' in window;

const KEY_WORKER = 'harvest_worker';
const KEY_WORKER_TIME = 'harvest_worker_time';
const KEY_DEVICE = 'harvest_device';
const KEY_ACCESS = 'harvest_key';
const KEY_VOICE = 'harvest_voice';
const KEY_QUEUE = 'harvest_queue';
const KEY_LOOKUP = 'harvest_lookup';

// localStorage（スマホの中にデータを保存する仕組み）を安全に使うための関数
function load(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function save(key, value) {
  try { localStorage.setItem(key, value); return true; } catch (e) { return false; }
}
function remove(key) {
  try { localStorage.removeItem(key); } catch (e) {}
}

function getDevice() { return load(KEY_DEVICE); }
function getKey() { return load(KEY_ACCESS); }
function voiceOn() { return load(KEY_VOICE) !== 'off'; }
function lookupOn() { return load(KEY_LOOKUP) === 'on'; }

// 有効な作業者名を返す（期限切れなら null）
function getWorker() {
  const name = load(KEY_WORKER);
  const time = Number(load(KEY_WORKER_TIME));
  if (!name || !time) return null;
  if (Date.now() - time > WORKER_EXPIRE_HOURS * 3600 * 1000) return null;
  return name;
}

// ---- 音声 ----
// iPhone は画面をタップしないと音が出ないことがある。その場合は 🔊 ボタンで読み上げる。
// Android は「読み取り開始」を押したあとは自動で読み上げられる。
let lastSpeech = '';
function speak(text) {
  lastSpeech = text || '';
  $('sayBtn').hidden = !lastSpeech || !voiceOn() || !('speechSynthesis' in window);
  if (!lastSpeech || !voiceOn() || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(lastSpeech);
    u.lang = 'ja-JP';
    u.rate = 1.1;
    speechSynthesis.speak(u);
  } catch (e) {}
}

// ---- 画面表示 ----
const $ = (id) => document.getElementById(id);

function show(type, icon, title, big, msg, speech) {
  $('card').className = 'card ' + (type || '');
  $('spinner').hidden = type !== 'sending';
  $('icon').hidden = type === 'sending';
  $('icon').textContent = icon || '';
  $('title').textContent = title || '';
  $('big').textContent = big || '';
  $('big').hidden = !big;
  $('msg').textContent = msg || '';
  $('history').hidden = true;
  speak(speech);
}

function refreshStatus() {
  const w = getWorker();
  const d = getDevice();
  $('nowWorker').textContent = w || '未設定';
  $('nowDevice').textContent = d ? '端末' + d : '未設定';
  $('nowKey').textContent = getKey() ? '設定済み' : '未設定';
  $('deviceBadge').textContent = (d ? '端末' + d : '端末 --') + (scanning ? ' 読み取り中' : '');
  $('deviceBadge').className = 'badge' + (scanning ? ' scanning' : '');
  $('voiceBtn').textContent = '音声：' + (voiceOn() ? 'ON' : 'OFF');
  $('scanBtn').hidden = !HAS_WEB_NFC || scanning;
  $('lookupBanner').hidden = !lookupOn();
  $('lookupBtn').textContent = '🔍 検索モード：' + (lookupOn() ? 'ON' : 'OFF');
  $('lookupBtn').className = lookupOn() ? 'lookup-on' : '';
  updatePending();
}

function buildDeviceButtons() {
  const box = $('deviceButtons');
  box.innerHTML = '';
  const current = getDevice();
  for (let i = 1; i <= DEVICE_COUNT; i++) {
    const no = String(i).padStart(2, '0');
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = no;
    if (no === current) b.className = 'active';
    b.onclick = () => {
      save(KEY_DEVICE, no);
      buildDeviceButtons();
      refreshStatus();
      showHome();
    };
    box.appendChild(b);
  }
}

function showHome() {
  $('settings').hidden = false;
  buildDeviceButtons();
  const w = getWorker();
  if (!getKey()) {
    show('warn', '🔑', '合言葉が未設定です', '', '管理者から受け取った「設定用リンク」をこの端末で開くか、端末設定カードをタッチしてください。');
  } else if (!getDevice()) {
    show('warn', '⚙️', '端末番号を設定してください', '', '下のボタンから、この端末の番号を選んでください。');
  } else if (lookupOn() && (!HAS_WEB_NFC || scanning)) {
    show('lookup', '🔍', '検索モード', '', '調べたいコンテナの NFC シールをタッチすると、誰が収穫したかを表示します。（記録はされません）');
  } else if (HAS_WEB_NFC && !scanning) {
    show('info', '📶', '「読み取り開始」を押してください', w || '', '押したあとは、カードやシールをかざすだけで記録されます。画面は点けたままにしてください。');
  } else if (!w) {
    show('info', '🪪', '作業者カードをタッチ', '', '自分の NFC カードをかざしてください。');
  } else {
    show('ok', '🧺', '準備OK', w, 'コンテナの NFC シールをタッチすると記録されます。');
  }
}

// ---- 各処理 ----

// 端末番号の設定（?device=01）
function handleDevice(value) {
  const n = parseInt(String(value).replace(/\D/g, ''), 10);
  if (!(n >= 1 && n <= DEVICE_COUNT)) {
    show('ng', '❌', '端末番号が正しくありません', value, '01〜' + String(DEVICE_COUNT).padStart(2, '0') + ' を指定してください。', 'エラー');
    return;
  }
  const no = String(n).padStart(2, '0');
  save(KEY_DEVICE, no);
  show('ok', '✅', '端末番号を設定しました', '端末' + no, '', '端末' + n + 'を設定しました');
}

// 作業者カード（?w=山田太郎）
function handleWorker(name) {
  name = name.trim().slice(0, 30);
  if (!name) {
    show('ng', '❌', '作業者カードが読めません', '', 'カードの書き込み内容を確認してください。', 'カードが読めません');
    return;
  }
  const ok = save(KEY_WORKER, name) && save(KEY_WORKER_TIME, String(Date.now()));
  if (!ok) {
    show('ng', '❌', '保存できませんでした', '', 'ブラウザの「プライベート（シークレット）モード」をオフにしてください。', '保存できませんでした');
    return;
  }
  show('ok', '👤', '作業者をセットしました', name, 'つづけてコンテナの NFC シールをタッチしてください。', name + 'さん');
}

// コンテナシール（?c=0001）。記録に必要な情報がそろっていれば送信内容を返す
function prepareRecord(value, time) {
  const n = parseInt(value, 10);
  if (!/^\d{1,4}$/.test(value) || !(n >= CONTAINER_MIN && n <= CONTAINER_MAX)) {
    show('ng', '❌', 'コンテナ番号が正しくありません', value, 'シールの書き込み内容を確認してください。', 'コンテナ番号が正しくありません');
    return null;
  }
  const container = String(n).padStart(4, '0');

  const device = getDevice();
  if (!device) {
    $('settings').hidden = false;
    buildDeviceButtons();
    show('ng', '⚙️', '端末番号が未設定です', 'No.' + container, '下のボタンで端末番号を選んでから、もう一度コンテナをタッチしてください。（まだ記録されていません）', '端末番号が未設定です');
    return null;
  }

  const key = getKey();
  if (!key) {
    show('ng', '🔑', '合言葉が未設定です', 'No.' + container, '管理者から受け取った「設定用リンク」を開いてから、もう一度コンテナをタッチしてください。（まだ記録されていません）', '合言葉が未設定です');
    return null;
  }

  const worker = getWorker();
  if (!worker) {
    show('ng', '🪪', '作業者が未設定です', 'No.' + container, '先に自分の作業者カードをタッチしてから、もう一度コンテナをタッチしてください。（まだ記録されていません）', '作業者カードをタッチしてください');
    return null;
  }

  return {
    action: 'record',
    t: String(time.getTime()),
    worker: worker,
    container: container,
    device: device,
    // 記録ID：同じ記録が二重に登録されるのを防ぐための目印
    rid: time.getTime().toString(36) + '-' + Math.random().toString(36).slice(2, 8),
    key: key
  };
}

// iPhone：GAS へ画面移動して記録する（fetch ではなく画面移動なので CORS の問題が起きない）
function sendByPageMove(item) {
  show('sending', '', '記録しています…', 'No.' + item.container, item.worker + ' さん');
  location.href = GAS_URL + '?' + new URLSearchParams(item).toString();
}

// ================================================================
// Android（Web NFC）：画面を開いたまま、かざすだけで記録する
// ================================================================
let scanning = false;
let wakeLock = null;
let lastSerial = '', lastSerialTime = 0;

async function startScan() {
  // ボタンを押したこの瞬間に一度しゃべらせておくと、以降も自動で読み上げられる
  speak('読み取りを開始します');
  try {
    const reader = new NDEFReader();
    await reader.scan();
    reader.onreading = onReading;
    reader.onreadingerror = () => {
      show('ng', '❌', '読み取れませんでした', '', 'もう一度ゆっくりかざしてください。', 'もう一度タッチしてください');
    };
    scanning = true;
    $('modeLabel').textContent = '収穫記録（かざすだけで記録）';
    keepScreenOn();
    refreshStatus();
    const w = getWorker();
    if (lookupOn()) {
      showHome();
    } else if (w) {
      show('ok', '🧺', '読み取り中', w, 'コンテナの NFC シールをかざしてください。');
    } else {
      show('info', '🪪', '読み取り中', '', '自分の作業者カードをかざしてください。');
    }
  } catch (e) {
    show('ng', '❌', 'NFC を開始できません', '', 'スマホの設定で NFC がオンになっているか確認してください。（' + e.message + '）', 'NFCを開始できません');
  }
}

// 画面が勝手に消えないようにする
async function keepScreenOn() {
  try {
    if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && scanning) keepScreenOn();
});

function onReading(event) {
  const now = new Date();
  // 同じタグがくっついたままで何度も読まれるのを防ぐ（3秒以内の同じタグは無視）
  if (event.serialNumber && event.serialNumber === lastSerial && now - lastSerialTime < 3000) return;
  lastSerial = event.serialNumber || '';
  lastSerialTime = now.getTime();

  let url = null;
  for (const record of event.message.records) {
    if (record.recordType === 'url' || record.recordType === 'absolute-url') {
      url = new TextDecoder().decode(record.data);
      break;
    }
  }
  let params = null;
  try { params = url ? new URL(url).searchParams : null; } catch (e) {}
  if (!params) {
    show('ng', '❌', 'このタグは使えません', '', '収穫記録用のカード・シールではありません。', 'このタグは使えません');
    return;
  }
  handleParams(params, 'scan', now);
  refreshStatus();
}

// ---- 送れなかった記録の保管と再送 ----
function loadQueue() {
  try { return JSON.parse(load(KEY_QUEUE) || '[]'); } catch (e) { return []; }
}
const queue = loadQueue();
function saveQueue() { save(KEY_QUEUE, JSON.stringify(queue)); }

function updatePending() {
  $('pending').hidden = queue.length === 0;
  $('pending').textContent = '未送信 ' + queue.length + ' 件（電波が戻ると自動で送ります）';
}

// GAS を <script> タグで呼ぶ（JSONP 方式。CORS の制限を受けない）
function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
    const s = document.createElement('script');
    const tm = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 20000);
    function cleanup() { clearTimeout(tm); delete window[cb]; s.remove(); }
    window[cb] = (data) => { cleanup(); resolve(data); };
    s.onerror = () => { cleanup(); reject(new Error('load')); };
    s.src = url + '&callback=' + cb;
    document.head.appendChild(s);
  });
}

function sendInBackground(item) {
  queue.push(item);
  saveQueue();
  show('sending', '', '記録しています…', 'No.' + item.container, item.worker + ' さん');
  flushQueue(item.rid);
}

let flushing = false;
async function flushQueue(currentRid) {
  if (flushing) return;
  flushing = true;
  try {
    while (queue.length) {
      const item = queue[0];
      const isCurrent = item.rid === currentRid;
      let res;
      try {
        res = await jsonp(GAS_URL + '?' + new URLSearchParams(Object.assign({}, item, { format: 'json', key: getKey() || item.key })).toString());
      } catch (e) {
        if (isCurrent || queue.some((q) => q.rid === currentRid)) {
          show('warn', '📶', '電波が弱いため未送信です', 'No.' + item.container,
            'この記録はスマホに保存しました。電波が戻ると自動で送ります。', '未送信です。あとで自動で送ります');
        }
        break;
      }
      if (res.status === 'key') {
        // 合言葉が違う場合は再送しても無駄なので止める
        show('ng', '🔑', res.title, '', res.sub, res.speech);
        break;
      }
      queue.shift();
      saveQueue();
      if (isCurrent) {
        const type = res.status === 'ok' ? 'ok' : res.status === 'dup' ? 'warn' : 'ng';
        const icon = { ok: '✅', warn: '⚠️', ng: '❌' }[type];
        show(type, icon, res.title, res.big || '', (res.detail || '') + (res.sub ? '\n' + res.sub : ''), res.speech);
      }
    }
  } finally {
    flushing = false;
    updatePending();
  }
}
setInterval(() => { if (queue.length) flushQueue(null); }, RETRY_SECONDS * 1000);
window.addEventListener('online', () => flushQueue(null));

// ================================================================
// 検索モード：コンテナを誰が収穫したかを調べる（記録はしない）
// ================================================================
async function lookupContainer(value) {
  const n = parseInt(value, 10);
  if (!/^\d{1,4}$/.test(value) || !(n >= CONTAINER_MIN && n <= CONTAINER_MAX)) {
    show('ng', '❌', 'コンテナ番号が正しくありません', value, '', 'コンテナ番号が正しくありません');
    return;
  }
  const container = String(n).padStart(4, '0');
  const key = getKey();
  if (!key) {
    show('ng', '🔑', '合言葉が未設定です', 'No.' + container, '設定用リンクを開いてください。', '合言葉が未設定です');
    return;
  }
  show('sending', '', '検索しています…', 'No.' + container, '');
  let res;
  try {
    res = await jsonp(GAS_URL + '?' + new URLSearchParams({ action: 'lookup', container: container, key: key }).toString());
  } catch (e) {
    show('ng', '📶', '検索できませんでした', 'No.' + container, '電波の良い場所でもう一度タッチしてください。', '検索できませんでした');
    return;
  }
  if (res.error === 'key') {
    show('ng', '🔑', '合言葉が違います', '', '設定用リンクを開き直してください。', '合言葉が違います');
    return;
  }
  if (!res.rows || !res.rows.length) {
    show('lookup', '🔍', 'No.' + container, '記録なし', 'このコンテナの収穫記録はまだありません。', '記録がありません');
    return;
  }
  const dayLabel = (d) => d === res.today ? '今日' : d.slice(5).replace('-', '/');
  const [d, t, worker, dev] = res.rows[0];
  const [hh, mm] = t.split(':').map(Number);
  show('lookup', '🔍', 'No.' + container + ' を収穫した人', worker,
    dayLabel(d) + ' ' + t + ' ／ 端末' + dev,
    worker + 'さん、' + (d === res.today ? '' : dayLabel(d).replace('/', '月') + '日、') + hh + '時' + mm + '分');
  const older = res.rows.slice(1, 6);
  if (older.length) {
    $('history').innerHTML = '';
    const head = document.createElement('li');
    head.textContent = '― それより前の記録 ―';
    $('history').appendChild(head);
    older.forEach((r) => {
      const li = document.createElement('li');
      li.textContent = dayLabel(r[0]) + ' ' + r[1] + '　' + r[2];
      $('history').appendChild(li);
    });
    $('history').hidden = false;
  }
}

// ================================================================
// 共通：タグや URL の内容に応じて処理する
// mode = 'page'（URL を開いた：iPhone）/ 'scan'（Web NFC で読んだ：Android）
// ================================================================
function handleParams(params, mode, time) {
  // ?worker= と ?setup= は以前のバージョンで作ったカード用
  const device = params.get('device') ?? params.get('setup');
  const w = params.get('w') ?? params.get('worker');
  const c = params.get('c');
  const key = params.get('key');

  // 合言葉（GAS に記録するときの鍵）。GitHub には書かず、この端末の中だけに保存する
  if (key !== null && /^[A-Za-z0-9]{8,64}$/.test(key)) {
    save(KEY_ACCESS, key);
  }

  if (device !== null) {
    handleDevice(device);
  } else if (key !== null) {
    if (getKey() === key) {
      show('ok', '🔑', '合言葉を設定しました', '', '', '合言葉を設定しました');
    } else {
      show('ng', '❌', '合言葉が正しくありません', '', '設定用リンクを確認してください。', '合言葉が正しくありません');
    }
  } else if (w !== null) {
    handleWorker(w);
  } else if (c !== null && lookupOn()) {
    lookupContainer(c.trim());
  } else if (c !== null) {
    const item = prepareRecord(c.trim(), time);
    if (!item) return;
    // Android は URL で開いた場合も裏で送る（画面移動しないので速く、未送信の保管もできる）
    if (mode === 'scan' || HAS_WEB_NFC) sendInBackground(item);
    else sendByPageMove(item);
  } else {
    return false;
  }
  return true;
}

$('clearWorker').onclick = () => {
  remove(KEY_WORKER);
  remove(KEY_WORKER_TIME);
  refreshStatus();
  showHome();
};
$('voiceBtn').onclick = () => {
  save(KEY_VOICE, voiceOn() ? 'off' : 'on');
  refreshStatus();
  if (voiceOn()) speak('音声をオンにしました');
};
$('sayBtn').onclick = () => speak(lastSpeech);
$('lookupBtn').onclick = () => {
  save(KEY_LOOKUP, lookupOn() ? 'off' : 'on');
  refreshStatus();
  showHome();
  speak(lookupOn() ? '検索モードです。記録はされません' : '記録モードに戻しました');
};
$('scanBtn').onclick = startScan;

// ---- ここから実行 ----
(function main() {
  const params = new URLSearchParams(location.search);

  // 読み取ったら URL からパラメータを消す。
  // （「戻る」や再読み込みで同じコンテナが二重に送信されるのを防ぐため）
  if (location.search) {
    history.replaceState(null, '', location.pathname);
  }

  if (!handleParams(params, 'page', touchTime)) showHome();
  refreshStatus();
  if (HAS_WEB_NFC) $('settings').hidden = false;
  if (queue.length) flushQueue(null);
})();

// 「戻る」でページがキャッシュから表示された場合はホーム画面に戻す
window.addEventListener('pageshow', (e) => {
  if (e.persisted) { refreshStatus(); showHome(); }
});
</script>
