<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>収穫記録</title>
<style>
  :root {
    --bg: #f4f6f2;
    --card: #ffffff;
    --text: #1d1f1b;
    --sub: #5b6157;
    --ok: #1f8a3b;
    --warn: #c77700;
    --ng: #c62828;
    --info: #2a78d6;
    --line: #dde2d8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141613;
      --card: #1f221d;
      --text: #f0f2ec;
      --sub: #b3b9ac;
      --line: #33382f;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    min-height: 100vh;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 15px; color: var(--sub); margin-bottom: 12px;
  }
  .badge {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 12px; font-weight: 600;
  }
  .card {
    background: var(--card); border-radius: 20px; padding: 28px 20px;
    text-align: center; border: 4px solid var(--line);
  }
  .card.ok   { border-color: var(--ok); }
  .card.warn { border-color: var(--warn); }
  .card.ng   { border-color: var(--ng); }
  .card.info { border-color: var(--info); }
  .icon { font-size: 64px; line-height: 1; margin-bottom: 12px; }
  h1 { font-size: 26px; margin: 0 0 12px; }
  .big { font-size: 40px; font-weight: 800; margin: 8px 0; word-break: break-all; }
  .msg { font-size: 18px; color: var(--sub); line-height: 1.6; margin: 0; }
  .status {
    margin-top: 16px; background: var(--card); border-radius: 16px;
    padding: 16px; border: 1px solid var(--line); font-size: 16px; line-height: 1.9;
  }
  .status b { font-size: 18px; }
  .section-title { font-size: 14px; color: var(--sub); margin: 24px 0 8px; }
  .devices { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  button, .btn {
    appearance: none; -webkit-appearance: none;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 12px; padding: 14px 0; font-size: 18px; font-weight: 700;
    width: 100%; text-align: center; text-decoration: none; display: block;
  }
  button.active { background: var(--info); color: #fff; border-color: var(--info); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .spinner {
    width: 56px; height: 56px; margin: 0 auto 16px;
    border: 6px solid var(--line); border-top-color: var(--info);
    border-radius: 50%; animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <span>収穫記録</span>
    <span class="badge" id="deviceBadge">端末 --</span>
  </div>

  <!-- メイン表示（状況に応じて中身が変わる） -->
  <div class="card" id="card">
    <div id="spinner" class="spinner" hidden></div>
    <div class="icon" id="icon"></div>
    <h1 id="title"></h1>
    <div class="big" id="big"></div>
    <p class="msg" id="msg"></p>
  </div>

  <!-- 現在の設定 -->
  <div class="status" id="status">
    作業者：<b id="nowWorker">未設定</b><br>
    端末番号：<b id="nowDevice">未設定</b><br>
    合言葉：<b id="nowKey">未設定</b>
  </div>

  <!-- 設定（ホーム画面のときだけ表示） -->
  <div id="settings" hidden>
    <div class="section-title">この iPhone の端末番号（最初に1回だけ設定）</div>
    <div class="devices" id="deviceButtons"></div>

    <div class="section-title">その他</div>
    <div class="row">
      <button type="button" id="clearWorker">作業者を解除</button>
      <a class="btn" href="dashboard.html">ダッシュボード</a>
    </div>
  </div>

</div>

<script>
// ====== 設定 ======================================================
// GAS（Google Apps Script）のウェブアプリURL
const GAS_URL = 'https://script.google.com/macros/s/AKfycbx3n7p5f1efbJdAP9n-h1xkLPK2cTUjf36nQZNvX2suCPaiv8Ae1-qRJPLJA6mahX7L/exec';
// 作業者カードをタッチしてから何時間で作業者設定を無効にするか（翌日の付け忘れ防止）
const WORKER_EXPIRE_HOURS = 12;
// 端末の台数
const DEVICE_COUNT = 5;
// コンテナ番号の範囲
const CONTAINER_MIN = 1;
const CONTAINER_MAX = 1000;
// ================================================================

// ページが開いた瞬間＝NFCをタッチした瞬間 の時刻を最初に記録しておく
const touchTime = new Date();

const KEY_WORKER = 'harvest_worker';
const KEY_WORKER_TIME = 'harvest_worker_time';
const KEY_DEVICE = 'harvest_device';
const KEY_ACCESS = 'harvest_key';

// localStorage（iPhoneの中にデータを保存する仕組み）を安全に使うための関数
function load(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function save(key, value) {
  try { localStorage.setItem(key, value); return true; } catch (e) { return false; }
}
function remove(key) {
  try { localStorage.removeItem(key); } catch (e) {}
}

function getDevice() { return load(KEY_DEVICE); }
function getKey() { return load(KEY_ACCESS); }

// 有効な作業者名を返す（期限切れなら null）
function getWorker() {
  const name = load(KEY_WORKER);
  const time = Number(load(KEY_WORKER_TIME));
  if (!name || !time) return null;
  if (Date.now() - time > WORKER_EXPIRE_HOURS * 3600 * 1000) return null;
  return name;
}

// ---- 画面表示 ----
const $ = (id) => document.getElementById(id);

function show(type, icon, title, big, msg) {
  $('card').className = 'card ' + (type || '');
  $('spinner').hidden = type !== 'sending';
  $('icon').hidden = type === 'sending';
  $('icon').textContent = icon || '';
  $('title').textContent = title || '';
  $('big').textContent = big || '';
  $('big').hidden = !big;
  $('msg').textContent = msg || '';
}

function refreshStatus() {
  const w = getWorker();
  const d = getDevice();
  $('nowWorker').textContent = w || '未設定';
  $('nowDevice').textContent = d ? '端末' + d : '未設定';
  $('nowKey').textContent = getKey() ? '設定済み' : '未設定';
  $('deviceBadge').textContent = d ? '端末' + d : '端末 --';
}

function buildDeviceButtons() {
  const box = $('deviceButtons');
  box.innerHTML = '';
  const current = getDevice();
  for (let i = 1; i <= DEVICE_COUNT; i++) {
    const no = String(i).padStart(2, '0');
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = no;
    if (no === current) b.className = 'active';
    b.onclick = () => {
      save(KEY_DEVICE, no);
      buildDeviceButtons();
      refreshStatus();
      showHome();
    };
    box.appendChild(b);
  }
}

function showHome() {
  $('settings').hidden = false;
  buildDeviceButtons();
  const w = getWorker();
  if (!getKey()) {
    show('warn', '🔑', '合言葉が未設定です', '', '管理者から受け取った「設定用リンク」をこの iPhone で開くか、端末設定カードをタッチしてください。');
  } else if (!getDevice()) {
    show('warn', '⚙️', '端末番号を設定してください', '', '下のボタンから、この iPhone の番号を選んでください。');
  } else if (!w) {
    show('info', '🪪', '作業者カードをタッチ', '', '自分の NFC カードを iPhone の上部にかざしてください。');
  } else {
    show('ok', '🧺', '準備OK', w, 'コンテナの NFC シールをタッチすると記録されます。');
  }
}

// ---- 各処理 ----

// 端末番号の設定（URL ?device=01 で開いた場合）
function handleDevice(value) {
  const n = parseInt(String(value).replace(/\D/g, ''), 10);
  if (!(n >= 1 && n <= DEVICE_COUNT)) {
    show('ng', '❌', '端末番号が正しくありません', value, '01〜' + String(DEVICE_COUNT).padStart(2, '0') + ' を指定してください。');
    return;
  }
  const no = String(n).padStart(2, '0');
  save(KEY_DEVICE, no);
  show('ok', '✅', '端末番号を設定しました', '端末' + no, '');
}

// 作業者カードをタッチした場合（URL ?w=山田太郎）
function handleWorker(name) {
  name = name.trim().slice(0, 30);
  if (!name) {
    show('ng', '❌', '作業者カードが読めません', '', 'カードの書き込み内容を確認してください。');
    return;
  }
  const ok = save(KEY_WORKER, name) && save(KEY_WORKER_TIME, String(Date.now()));
  if (!ok) {
    show('ng', '❌', '保存できませんでした', '', 'Safari の「プライベートブラウズ」をオフにしてください。');
    return;
  }
  show('ok', '👤', '作業者をセットしました', name, 'つづけてコンテナの NFC シールをタッチしてください。');
}

// コンテナシールをタッチした場合（URL ?c=0001）
function handleContainer(value) {
  const n = parseInt(value, 10);
  if (!/^\d{1,4}$/.test(value) || !(n >= CONTAINER_MIN && n <= CONTAINER_MAX)) {
    show('ng', '❌', 'コンテナ番号が正しくありません', value, 'シールの書き込み内容を確認してください。');
    return;
  }
  const container = String(n).padStart(4, '0');

  const device = getDevice();
  if (!device) {
    $('settings').hidden = false;
    buildDeviceButtons();
    show('ng', '⚙️', '端末番号が未設定です', 'No.' + container, '下のボタンで端末番号を選んでから、もう一度コンテナをタッチしてください。（まだ記録されていません）');
    return;
  }

  const key = getKey();
  if (!key) {
    show('ng', '🔑', '合言葉が未設定です', 'No.' + container, '管理者から受け取った「設定用リンク」を開いてから、もう一度コンテナをタッチしてください。（まだ記録されていません）');
    return;
  }

  const worker = getWorker();
  if (!worker) {
    show('ng', '🪪', '作業者が未設定です', 'No.' + container, '先に自分の作業者カードをタッチしてから、もう一度コンテナをタッチしてください。（まだ記録されていません）');
    return;
  }

  // 記録ID：同じ記録が二重に登録されるのを防ぐための目印
  const rid = touchTime.getTime().toString(36) + '-' + Math.random().toString(36).slice(2, 8);

  const q = new URLSearchParams({
    action: 'record',
    t: String(touchTime.getTime()),
    worker: worker,
    container: container,
    device: device,
    rid: rid,
    key: key
  });

  show('sending', '', '記録しています…', 'No.' + container, worker + ' さん');

  // GAS へ移動して記録する（fetch ではなく画面移動なので CORS の問題が起きない）
  location.href = GAS_URL + '?' + q.toString();
}

$('clearWorker').onclick = () => {
  remove(KEY_WORKER);
  remove(KEY_WORKER_TIME);
  refreshStatus();
  showHome();
};

// ---- ここから実行 ----
(function main() {
  const params = new URLSearchParams(location.search);
  // ?worker= と ?setup= は以前のバージョンで作ったカード用
  const device = params.get('device') ?? params.get('setup');
  const w = params.get('w') ?? params.get('worker');
  const c = params.get('c');
  const key = params.get('key');

  // 読み取ったら URL からパラメータを消す。
  // （「戻る」や再読み込みで同じコンテナが二重に送信されるのを防ぐため）
  if (location.search) {
    history.replaceState(null, '', location.pathname);
  }

  // 合言葉（GAS に記録するときの鍵）。GitHub には書かず、この iPhone の中だけに保存する
  if (key !== null && /^[A-Za-z0-9]{8,64}$/.test(key)) {
    save(KEY_ACCESS, key);
  }

  if (device !== null) {
    handleDevice(device);
  } else if (key !== null) {
    if (getKey() === key) {
      show('ok', '🔑', '合言葉を設定しました', '', '');
    } else {
      show('ng', '❌', '合言葉が正しくありません', '', '設定用リンクを確認してください。');
    }
  } else if (w !== null) {
    handleWorker(w);
  } else if (c !== null) {
    handleContainer(c.trim());
  } else {
    showHome();
  }
  refreshStatus();
})();

// Safari の「戻る」でページがキャッシュから表示された場合はホーム画面に戻す
window.addEventListener('pageshow', (e) => {
  if (e.persisted) { refreshStatus(); showHome(); }
});
</script>
</body>
</html>
